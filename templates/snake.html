<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; color: white; }
        canvas { background: #16213e; border: 2px solid #e94560; }
        .score { font-size: 24px; margin-bottom: 20px; }
        .back-btn { color: #e94560; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="score">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <a href="/" class="back-btn">⬅ رجوع</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const box = 20;
        let snake = [{x: 200, y: 200}];
        let direction = {x: 0, y: -box};
        let food = {x: Math.floor(Math.random() * 20) * box, y: Math.floor(Math.random() * 20) * box};
        let score = 0;

        function gameLoop() {
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.textContent = score;
                food = {x: Math.floor(Math.random() * 20) * box, y: Math.floor(Math.random() * 20) * box};
            } else {
                snake.pop();
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e94560';
            snake.forEach(seg => ctx.fillRect(seg.x, seg.y, box-2, box-2));
            ctx.fillStyle = '#f5c842';
            ctx.fillRect(food.x, food.y, box-2, box-2);
        }

        setInterval(gameLoop, 150);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' && direction.y === 0) direction = {x: 0, y: -box};
            else if (e.key === 'ArrowDown' && direction.y === 0) direction = {x: 0, y: box};
            else if (e.key === 'ArrowLeft' && direction.x === 0) direction = {x: -box, y: 0};
            else if (e.key === 'ArrowRight' && direction.x === 0) direction = {x: box, y: 0};
        });
    </script>
</body>
</html>
