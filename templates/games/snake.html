{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="score">Score: <span id="score">0</span></div>
    <input id="playerName" placeholder="Your name" value="Player">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <br>
    <a href="/" class="back-btn">⬅ رجوع</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const playerNameEl = document.getElementById('playerName');
        const box = 20;
        let snake = [{x: 200, y: 200}];
        let direction = {x: 0, y: -box};
        let food = {x: Math.floor(Math.random() * 20) * box, y: Math.floor(Math.random() * 20) * box};
        let score = 0;
        let gameOver = false;

        function saveScore() {
            const playerName = playerNameEl.value || 'Player';
            fetch('/save-score/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({player_name: playerName, game: 'snake', score: score})
            });
        }

        function gameLoop() {
            if (gameOver) return;
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400 || snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver = true;
                saveScore();
                return;
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.textContent = score;
                food = {x: Math.floor(Math.random() * 20) * box, y: Math.floor(Math.random() * 20) * box};
            } else {
                snake.pop();
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e94560';
            snake.forEach(seg => ctx.fillRect(seg.x, seg.y, box-2, box-2));
            ctx.fillStyle = '#f5c842';
            ctx.fillRect(food.x, food.y, box-2, box-2);
        }

        setInterval(gameLoop, 150);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' && direction.y === 0) direction = {x: 0, y: -box};
            else if (e.key === 'ArrowDown' && direction.y === 0) direction = {x: 0, y: box};
            else if (e.key === 'ArrowLeft' && direction.x === 0) direction = {x: -box, y: 0};
            else if (e.key === 'ArrowRight' && direction.x === 0) direction = {x: box, y: 0};
        });
    </script>

</body>
</html>
